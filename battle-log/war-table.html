<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ War Table — Council Chamber</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #0d0d1a;
    --table-color: #2a1810;
    --table-edge: #4a2820;
    --text: #e0e0f0;
    --text-dim: #6666aa;
    --bubble-bg: #1a1a2e;
    --bubble-border: #3a3a5a;
    --gold: #ffd700;
    --cyan: #00e5ff;
    --fire: #ff4444;
    --green: #44ff88;
    --purple: #aa44ff;
    --orange: #ff8844;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Press Start 2P', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* === Navigation === */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: #0a0a14;
    border-bottom: 2px solid #2a2a3a;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    z-index: 1000;
    font-size: 8px;
  }

  .nav a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 4px 8px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .nav a:hover, .nav a.active {
    color: var(--gold);
    border-color: var(--gold);
  }

  /* === Visual Mode Toggle === */
  .mode-toggle {
    display: flex;
    gap: 4px;
    margin-left: 16px;
    border: 1px solid #3a3a5a;
    border-radius: 3px;
    padding: 2px;
  }

  .mode-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    padding: 3px 6px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }

  .mode-btn:hover { color: var(--text); }
  .mode-btn.active {
    color: var(--gold);
    border-color: var(--gold);
    background: rgba(255, 215, 0, 0.1);
  }

  /* === War Table Scene === */
  .scene {
    position: relative;
    width: 100vw;
    height: calc(100vh - 40px);
    margin-top: 40px;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 70%);
  }

  /* === The Table (oval, top-down view) === */
  .war-table {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 350px;
    background: radial-gradient(ellipse, #3d2418 0%, #2a1810 60%, #1a0f0a 100%);
    border-radius: 50%;
    border: 4px solid var(--table-edge);
    box-shadow:
      0 0 60px rgba(42, 24, 16, 0.5),
      inset 0 0 40px rgba(0, 0, 0, 0.4);
  }

  .war-table::after {
    content: '⚔️ WAR COUNCIL';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10px;
    color: var(--gold);
    opacity: 0.4;
    text-align: center;
    letter-spacing: 2px;
  }

  /* === Agent Seats (positioned around the table) === */
  .seat {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s;
    opacity: 0;
    transform: scale(0.8);
  }

  .seat.present {
    opacity: 1;
    transform: scale(1);
  }

  .seat.active {
    animation: seatGlow 1.5s ease infinite;
  }

  @keyframes seatGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3) drop-shadow(0 0 8px var(--cyan)); }
  }

  /* === Agent Avatars (SVG pixel art on plates) === */
  .sprite {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle, #1a2030 0%, #0d1520 80%);
    border: 2px solid rgba(0, 229, 255, 0.3);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.15), inset 0 0 8px rgba(0, 0, 0, 0.4);
    position: relative;
    image-rendering: pixelated;
  }

  .sprite img {
    width: 48px;
    height: 48px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Glow colors per agent type */
  .sprite-scout { border-color: rgba(68, 255, 136, 0.5); box-shadow: 0 0 12px rgba(68, 255, 136, 0.2); }
  .sprite-specialist { border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 0 12px rgba(0, 229, 255, 0.2); }
  .sprite-sage { border-color: rgba(170, 100, 255, 0.5); box-shadow: 0 0 12px rgba(170, 100, 255, 0.2); }
  .sprite-cloud { border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 0 12px rgba(255, 215, 0, 0.2); }
  .sprite-swarm { border-color: rgba(255, 136, 68, 0.5); box-shadow: 0 0 12px rgba(255, 136, 68, 0.2); }
  .sprite-memory { border-color: rgba(0, 180, 220, 0.5); box-shadow: 0 0 12px rgba(0, 180, 220, 0.2); }
  .sprite-router { border-color: rgba(68, 255, 136, 0.5); box-shadow: 0 0 12px rgba(68, 255, 136, 0.2); }
  .sprite-judge { border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 0 12px rgba(255, 215, 0, 0.2); }
  .sprite-test { border-color: rgba(68, 255, 136, 0.5); box-shadow: 0 0 12px rgba(68, 255, 136, 0.2); }
  .sprite-eye { border-color: rgba(170, 68, 255, 0.5); box-shadow: 0 0 12px rgba(170, 68, 255, 0.2); }
  .sprite-hypeman { border-color: rgba(255, 68, 68, 0.5); box-shadow: 0 0 12px rgba(255, 68, 68, 0.2); }
  .sprite-chain { border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 0 12px rgba(0, 229, 255, 0.2); }


  /* === Agent Name === */
  .seat-name {
    font-size: 9px;
    color: var(--gold);
    margin-top: 8px;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    background: rgba(0, 0, 0, 0.6);
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* === Chat Bubbles === */
  .bubble {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bubble-bg);
    border: 2px solid var(--bubble-border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 7px;
    line-height: 1.4;
    color: var(--text);
    max-width: 280px;
    white-space: normal;
    word-wrap: break-word;
    overflow-wrap: break-word;
    animation: bubbleIn 0.3s ease;
    z-index: 10;
    pointer-events: none;
  }

  .bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid var(--bubble-border);
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  @keyframes bubbleFade {
    from { opacity: 1; }
    to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }

  /* === RPG Dialogue Box === */
  .rpg-dialogue {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    max-width: 90vw;
    background: #0a0a1a;
    border: 3px solid var(--gold);
    border-radius: 4px;
    padding: 16px 20px;
    display: none;
    z-index: 500;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
  }

  .rpg-dialogue.visible { display: flex; gap: 16px; align-items: flex-start; }

  .rpg-dialogue .portrait {
    width: 80px;
    height: 80px;
    border: 2px solid var(--gold);
    flex-shrink: 0;
    image-rendering: pixelated;
    background-color: #0d0d1a;
    transform: scale(1.5);
    transform-origin: center center;
    margin: 10px;
  }

  .rpg-dialogue .dialogue-content {
    flex: 1;
  }

  .rpg-dialogue .speaker-name {
    font-size: 8px;
    color: var(--gold);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .rpg-dialogue .dialogue-text {
    font-size: 9px;
    line-height: 1.6;
    color: var(--text);
    min-height: 40px;
  }

  .rpg-dialogue .dialogue-text .cursor {
    display: inline-block;
    width: 8px;
    height: 10px;
    background: var(--text);
    animation: blink 0.5s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .rpg-dialogue .advance-hint {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 7px;
    color: var(--text-dim);
    animation: bounce 1s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* === Ace Attorney Battle === */
  .objection-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    z-index: 900;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .objection-overlay.visible { display: flex; }

  .objection-banner {
    font-size: 24px;
    color: var(--fire);
    animation: objectionSlam 0.5s ease;
    text-shadow: 0 0 20px var(--fire);
    margin-bottom: 30px;
  }

  @keyframes objectionSlam {
    0% { transform: scale(3); opacity: 0; }
    60% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1); }
  }

  .court-scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .court-agent {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .court-agent .sprite { width: 72px; height: 72px; }

  .court-agent .court-name {
    font-size: 8px;
    color: var(--gold);
  }

  .court-argument {
    background: var(--bubble-bg);
    border: 2px solid var(--fire);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 7px;
    max-width: 300px;
    max-height: 180px;
    overflow-y: auto;
    line-height: 1.5;
    margin-top: 10px;
  }

  .court-prompt {
    font-size: 8px;
    color: var(--cyan);
    text-align: center;
    margin-bottom: 16px;
    max-width: 500px;
    line-height: 1.5;
    border: 1px solid rgba(0, 229, 255, 0.3);
    padding: 8px 12px;
    border-radius: 4px;
    background: rgba(0, 229, 255, 0.05);
  }

  .court-verdict {
    font-size: 7px;
    color: var(--text);
    text-align: center;
    margin-top: 20px;
    max-width: 500px;
    line-height: 1.5;
    border: 2px solid var(--gold);
    padding: 10px 14px;
    border-radius: 4px;
    background: rgba(255, 215, 0, 0.05);
  }

  .court-verdict .verdict-label {
    font-size: 9px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .court-winner {
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(68, 255, 136, 0.2);
  }

  .court-loser {
    border-color: var(--text-dim);
    opacity: 0.7;
  }

  .vs-text {
    font-size: 20px;
    color: var(--gold);
    animation: pulse 1s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* === Status bar === */
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 24px;
    background: #0a0a14;
    border-top: 2px solid #2a2a3a;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 7px;
    color: var(--text-dim);
    gap: 16px;
    z-index: 100;
  }

  .status-bar .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  /* === Demon Castle Mode overrides === */
  .scene.mode-demon {
    background: url('assets/demon-castle/background.png') center/cover no-repeat, #0d0d1a;
  }

  .mode-demon .war-table {
    background: radial-gradient(ellipse, rgba(20, 10, 30, 0.85) 0%, rgba(15, 5, 20, 0.9) 60%, rgba(10, 0, 15, 0.95) 100%);
    border-color: #6a2090;
    box-shadow: 0 0 60px rgba(100, 30, 150, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.6);
  }

  .mode-demon .war-table::after {
    content: '💀 DEMON LORD\\'S WAR COUNCIL';
    color: #cc44ff;
  }

  .mode-demon .sprite {
    border-radius: 8px;
    background: radial-gradient(circle, rgba(30, 10, 40, 0.9) 0%, rgba(15, 5, 25, 0.95) 80%);
    border-color: rgba(170, 50, 255, 0.4);
    box-shadow: 0 0 12px rgba(170, 50, 255, 0.2), inset 0 0 8px rgba(0, 0, 0, 0.5);
  }

  .mode-demon .sprite img {
    width: 64px;
    height: 64px;
    image-rendering: auto;
    border-radius: 4px;
  }

  .mode-demon .seat-name {
    color: #cc88ff;
    text-shadow: 0 0 6px rgba(170, 68, 255, 0.4);
  }

  .mode-demon .bubble {
    background: rgba(30, 10, 50, 0.95);
    border-color: #6a2090;
  }

  .mode-demon .bubble::after {
    border-top-color: #6a2090;
  }

  /* === Tournament: Win/Loss Badge === */
  .seat-record {
    font-size: 7px;
    color: var(--text-dim);
    margin-top: 4px;
    text-align: center;
    background: rgba(0, 0, 0, 0.7);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid rgba(100, 100, 150, 0.3);
    white-space: nowrap;
  }

  .seat-record .wins { color: var(--green); }
  .seat-record .losses { color: var(--fire); }
  .seat-record .streak { color: var(--gold); font-size: 6px; }

  /* === Crown for Leader === */
  .crown {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    animation: crownFloat 2s ease-in-out infinite;
    z-index: 20;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
    display: none;
  }

  .crown.visible { display: block; }

  @keyframes crownFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-4px); }
  }

  /* === Re-optimized Death Animation === */
  @keyframes reoptimize {
    0% { transform: scale(1); filter: brightness(1); }
    10% { filter: brightness(3) hue-rotate(90deg); }
    20% { transform: scale(1.2) rotate(5deg); filter: brightness(2) saturate(3); }
    40% { transform: scale(0.8) rotate(-10deg); filter: brightness(4) hue-rotate(180deg); }
    60% { transform: scale(1.3) rotate(15deg) skewX(10deg); filter: brightness(0.5) saturate(0); }
    80% { transform: scale(0.3) rotate(-720deg); filter: brightness(6) contrast(3); opacity: 0.5; }
    90% { transform: scale(0.1) rotate(1080deg); opacity: 0.2; }
    100% { transform: scale(0) rotate(1440deg); opacity: 0; }
  }

  @keyframes reoptimizeReturn {
    0% { transform: scale(0); opacity: 0; filter: hue-rotate(360deg) brightness(3); }
    30% { transform: scale(1.3); opacity: 0.5; filter: hue-rotate(180deg) brightness(2); }
    60% { transform: scale(0.9); opacity: 0.8; filter: hue-rotate(90deg) brightness(1.5); }
    80% { transform: scale(1.05); opacity: 1; filter: hue-rotate(0deg) brightness(1.2); }
    100% { transform: scale(1); opacity: 1; filter: none; }
  }

  .seat.reoptimizing .sprite {
    animation: reoptimize 2s ease forwards;
  }

  .seat.reoptimized .sprite {
    animation: reoptimizeReturn 1.5s ease forwards;
  }

  .reoptimize-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: var(--fire);
    text-shadow: 0 0 20px var(--fire), 0 0 40px #ff0000;
    z-index: 999;
    animation: objectionSlam 0.5s ease;
    display: none;
    text-align: center;
    line-height: 1.6;
  }

  .reoptimize-banner.visible { display: block; }

  /* === Voice Toggle === */
  .voice-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 16px;
  }

  .voice-toggle label {
    font-size: 7px;
    color: var(--text-dim);
    cursor: pointer;
  }

  .voice-toggle input[type="checkbox"] {
    appearance: none;
    width: 28px;
    height: 14px;
    background: #2a2a3a;
    border-radius: 7px;
    position: relative;
    cursor: pointer;
    border: 1px solid #4a4a5a;
    transition: background 0.2s;
  }

  .voice-toggle input[type="checkbox"]::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 8px;
    height: 8px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all 0.2s;
  }

  .voice-toggle input[type="checkbox"]:checked {
    background: rgba(0, 229, 255, 0.3);
    border-color: var(--cyan);
  }

  .voice-toggle input[type="checkbox"]:checked::before {
    left: 16px;
    background: var(--cyan);
  }

  /* === Victory Flash === */
  @keyframes victoryFlash {
    0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8); }
    50% { box-shadow: 0 0 30px 10px rgba(255, 215, 0, 0.4); }
    100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
  }

  .seat.victory .sprite {
    animation: victoryFlash 1s ease 3;
  }
</style>
</head>
<body>

<div class="nav">
  <a href="/">📜 LOG</a>
  <a href="/war-table" class="active">⚔️ WAR TABLE</a>
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="pixel" title="SVG Pixel Art">🎮 PIXEL</button>
    <button class="mode-btn" data-mode="demon" title="Demon Lord Castle (AI Generated)">🏰 DEMON</button>
  </div>
  <div class="voice-toggle">
    <label for="voiceToggle">🔊 VOICES</label>
    <input type="checkbox" id="voiceToggle" title="Toggle Edge Neural TTS voices for dialogue">
  </div>
  <div class="voice-toggle">
    <label for="allVoicesToggle">⭐ VIP</label>
    <input type="checkbox" id="allVoicesToggle" title="VIP mode: only Judge & Hypeman speak (mutes regular agents)">
  </div>
  <div class="voice-toggle">
    <label for="sfxToggle">🎵 SFX</label>
    <input type="checkbox" id="sfxToggle" checked title="Toggle sound effects">
  </div>
  <div class="voice-toggle">
    <label for="focusToggle">🎯 FOCUS</label>
    <input type="checkbox" id="focusToggle" title="Focus mode: sequential dialogue, no overlapping speech">
  </div>
  <span style="margin-left: auto; color: var(--text-dim);">⚔️ WAR COUNCIL</span>
</div>

<div class="scene" id="scene">
  <div class="war-table"></div>
  <!-- Seats will be populated dynamically -->
</div>

<!-- RPG Dialogue Box (Hypeman) -->
<div class="rpg-dialogue" id="rpgDialogue">
  <div class="portrait sprite sprite-hypeman"></div>
  <div class="dialogue-content">
    <div class="speaker-name" id="rpgSpeaker">HYPEMAN</div>
    <div class="dialogue-text" id="rpgText"></div>
  </div>
  <div class="advance-hint">▼ CLICK</div>
</div>

<!-- Ace Attorney Overlay -->
<div class="objection-overlay" id="objectionOverlay">
  <div class="objection-banner" id="objectionBanner">⚡ OBJECTION! ⚡</div>
  <div class="court-scene" id="courtScene"></div>
</div>

<!-- Re-optimize Banner -->
<div class="reoptimize-banner" id="reoptBanner"></div>

<div class="status-bar">
  <div class="dot" id="connDot"></div>
  <span id="connStatus">Connecting...</span>
  <span style="margin-left: auto;" id="eventCount">0 events</span>
</div>

<script>
// === 16x16 Pixel Art Sprite Definitions ===
// Each sprite is a 16x16 grid. '_' = transparent, letters map to palette colors.
const PALETTES = {
  scout:      { a: '#44ff88', b: '#228844', c: '#33cc66', d: '#fff', e: '#1a5533', f: '#88ffbb' },
  specialist: { a: '#00e5ff', b: '#006688', c: '#00aabb', d: '#fff', e: '#004455', f: '#ffd700' },
  sage:       { a: '#aa66ff', b: '#6622aa', c: '#5500aa', d: '#fff', e: '#440088', f: '#ffd700' },
  cloud:      { a: '#ffd700', b: '#ffaa00', c: '#ffe44d', d: '#fff8b0', e: '#aa8800', f: '#fff' },
  swarm:      { a: '#ff8844', b: '#ffaa66', c: '#ff6622', d: '#ffd700', e: '#cc4400', f: '#ffcc88' },
  memory:     { a: '#00e5ff', b: '#006688', c: '#00aabb', d: '#fff', e: '#004455', f: '#88ddff' },
  router:     { a: '#44ff88', b: '#228844', c: '#33cc66', d: '#ffd700', e: '#115522', f: '#fff' },

// Generate SVG data URI from sprite definition
function makeSpriteURI(spriteName) {
  const grid = SPRITES[spriteName];
  const pal = PALETTES[spriteName];
  if (!grid || !pal) return '';

  let rects = '';
  for (let y = 0; y < 16; y++) {
    const row = grid[y];
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (ch !== '_' && pal[ch]) {
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[ch]}"/>`;
      }
    }
  }

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">${rects}</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Resume AudioContext on first user interaction (Chrome requires gesture)
['click', 'touchstart', 'keydown'].forEach(evt => {
  document.addEventListener(evt, function resumeAudio() {
    audioCtx.resume();
    ['click', 'touchstart', 'keydown'].forEach(e => document.removeEventListener(e, resumeAudio));
  }, { once: false });
});

function playSfx(type) {
  if (replayingHistory) return;
  if (!document.getElementById('sfxToggle').checked) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  switch (type) {
    case 'seat': // Agent appears at table
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
      break;
    case 'victory': // Tournament win
      osc.type = 'square';
      [523, 659, 784, 1047].forEach((f, i) => {
        osc.frequency.setValueAtTime(f, now + i * 0.1);
      });
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
      break;
    case 'defeat': // Tournament loss
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
      gain.gain.setValueAtTime(0.035, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
      break;
    case 'reoptimize': // Agent destroyed + rebuilt
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.setValueAtTime(0.06, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      osc.start(now); osc.stop(now + 1.0);
      // Second sound: rebuild chime
      setTimeout(() => {
        if (!document.getElementById('sfxToggle').checked) return;
        const osc2 = audioCtx.createOscillator();
        const g2 = audioCtx.createGain();
        osc2.connect(g2); g2.connect(audioCtx.destination);
        osc2.type = 'sine';
        const t = audioCtx.currentTime;
        [262, 330, 392, 523, 659, 784].forEach((f, i) => {
          osc2.frequency.setValueAtTime(f, t + i * 0.08);
        });
        g2.gain.setValueAtTime(0.04, t);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        osc2.start(t); osc2.stop(t + 0.6);
      }, 2200);
      break;
    case 'objection': // Ace Attorney OBJECTION
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.setValueAtTime(600, now + 0.05);
      osc.frequency.setValueAtTime(1200, now + 0.1);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      break;
    case 'bubble': // Chat bubble appears
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
      break;
  }
}

// === Animal Crossing Babble System ===
// Short sine-wave phonemes at varying pitches — one per character during typewriter
const BABBLE_PITCHES = [260, 290, 320, 350, 380, 410, 440, 470, 500, 530];
let babbleTimer = null;

function playBabbleChar(pitch) {
  if (!document.getElementById('sfxToggle').checked) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(pitch, now);
  // Slight pitch bend for expressiveness
  osc.frequency.exponentialRampToValueAtTime(pitch * (0.9 + Math.random() * 0.2), now + 0.06);
  gain.gain.setValueAtTime(0.035, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
  osc.start(now);
  osc.stop(now + 0.07);
}

// Typewriter with babble — reveals text character by character with Animal Crossing sounds
// Returns a Promise that resolves when typing is complete
function typewriterWithBabble(element, text, options = {}) {
  const speed = options.speed || 25; // ms per char
  const basePitch = options.basePitch || 350; // Higher for female voices

  return new Promise((resolve) => {
    let i = 0;
    element.textContent = '';

    function typeNext() {
      if (i >= text.length) {
        element.textContent = text;
        resolve();
        return;
      }

      const char = text[i];
      element.textContent = text.substring(0, i + 1);
      i++;

      // Play babble on non-space characters (skip when real voices are active)
      if (!voicesEnabled && char !== ' ' && char !== '\n' && i % 2 === 0) {
        const pitchVariance = basePitch + (Math.random() - 0.5) * 120;
        playBabbleChar(pitchVariance);
      }

      // Punctuation pauses (like Animal Crossing)
      const delay = '.!?'.includes(char) ? speed * 5 :
                    ',;:'.includes(char) ? speed * 3 :
                    speed + Math.random() * 10;

      babbleTimer = setTimeout(typeNext, delay);
    }

    typeNext();
  });
}

function stopBabble() {
  if (babbleTimer) { clearTimeout(babbleTimer); babbleTimer = null; }
}

// === Animal Crossing Babble Speech (Voice Replacement) ===
// When VOICES is off, this plays a full-length babble "speech" as a substitute for TTS.
// Each agent has a unique base pitch so they sound like different AC villagers.
// Gated by SFX toggle - if SFX is also off, no sound at all.
let babbleSpeechTimer = null;

function playBabbleSpeech(text, basePitch) {
  basePitch = basePitch || 350;
  return new Promise(function(resolve) {
    if (!document.getElementById('sfxToggle').checked) { resolve(); return; }

    var syllables = Math.min(Math.ceil(text.replace(/\s/g, '').length / 2), 100);
    var i = 0;
    // Vowel-aware pitch offsets for more AC character
    var VOWEL_BOOST = { a: 1.12, e: 1.18, i: 1.22, o: 0.88, u: 0.82 };
    // Wave types cycle: triangle for depth, sine for brightness, square for punch
    var WAVES = ['triangle', 'sine', 'sine', 'triangle', 'square'];

    function nextSyllable() {
      if (i >= syllables) { babbleSpeechTimer = null; resolve(); return; }
      if (!document.getElementById('sfxToggle').checked) { babbleSpeechTimer = null; resolve(); return; }

      var ch = (text[i * 2 % text.length] || 'a').toLowerCase();
      // Base pitch + per-syllable jitter + vowel-aware shaping
      var vowelMul = VOWEL_BOOST[ch] || 1.0;
      var jitter = (Math.random() - 0.5) * 200; // wider +/-100Hz spread
      var pitch = Math.max(120, Math.min(800, basePitch * vowelMul + jitter));
      // Occasional octave hop for playful Animal Crossing feel (8% chance)
      if (Math.random() < 0.08) pitch *= (Math.random() < 0.5 ? 1.5 : 0.75);

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      var now = audioCtx.currentTime;
      osc.type = WAVES[i % WAVES.length];
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(
        pitch * (0.78 + Math.random() * 0.44), now + 0.09
      );
      // Amplitude bounce: louder on stressed syllables (every 3rd)
      var vol = (i % 3 === 0) ? 0.065 : 0.04;
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);

      i++;

      // Punctuation pauses + occasional micro-stutter (5% chance double-beat)
      var delay;
      if ('.!?'.includes(ch)) { delay = 160 + Math.random() * 40; }
      else if (',;:'.includes(ch)) { delay = 100 + Math.random() * 30; }
      else if (ch === ' ') { delay = 60 + Math.random() * 20; }
      else if (Math.random() < 0.05) { delay = 15; } // micro-stutter rapid double
      else { delay = 38 + Math.random() * 28; }

      babbleSpeechTimer = setTimeout(nextSyllable, delay);
    }

    nextSyllable();
  });
}

function stopBabbleSpeech() {
  if (babbleSpeechTimer) { clearTimeout(babbleSpeechTimer); babbleSpeechTimer = null; }
}

      var basePitch = AGENT_BABBLE_BASE[agentKey] || 350;
      ttsQueue.push({ text: text, voice: voice, babble: true, basePitch: basePitch });
      if (!ttsSpeaking) processTtsQueue();
    }
    return;
  }

  ttsQueue.push({ text: text, voice: voice });
  if (!ttsSpeaking) processTtsQueue();
}

async function processTtsQueue() {
  if (ttsQueue.length === 0) {
    ttsSpeaking = false;
    if (focusTtsResolve) { focusTtsResolve(); focusTtsResolve = null; }
    return;
  }
  ttsSpeaking = true;
  const item = ttsQueue.shift();

  // Babble speech (voice replacement when VOICES off)
  if (item.babble) {
    playBabbleSpeech(item.text, item.basePitch).then(function() { processTtsQueue(); });
    return;
  }

  // Real Edge TTS (with one retry for cold-start failures)
  const trimmed = item.text.length > 200 ? item.text.substring(0, 197) + '...' : item.text;
  const ttsPayload = JSON.stringify({ text: trimmed, voice: item.voice });

  async function attemptTts(retries) {
    const res = await fetch('/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: ttsPayload,
    });
    if (res.ok && res.status === 200) {
      const blob = await res.blob();
      if (blob.size > 0) return blob;
    }
    if (retries > 0) {
      await new Promise(r => setTimeout(r, 1000));
      return attemptTts(retries - 1);
    }
    return null;
  }

  try {
    const blob = await attemptTts(1);
    if (blob) {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.volume = 0.7;
      audio.onended = () => { URL.revokeObjectURL(url); processTtsQueue(); };
      audio.onerror = () => { URL.revokeObjectURL(url); processTtsQueue(); };
      audio.play().catch(() => processTtsQueue());
      return; // Wait for onended
    }
    // TTS returned empty — surface warning
    const statusEl = document.getElementById('connStatus');
    if (statusEl && voicesEnabled) {
      statusEl.textContent = 'TTS unavailable — voice token may have expired';
      statusEl.style.color = 'var(--fire)';
    }
  } catch (e) {
    console.debug('Edge TTS proxy error:', e.message);
  }
  processTtsQueue(); // On failure, move to next
}

// Reverse lookup: display name u{2192} canonical tool key (for seat dedup)
const AGENT_NAME_TO_KEY = {};
Object.entries(AGENTS).forEach(([key, a]) => {
  AGENT_NAME_TO_KEY[a.name.toLowerCase()] = key;
});

function normalizeToolKey(raw) {
  if (AGENTS[raw]) return raw;
  if (seatedAgents[raw]) return raw;
  var lower = raw.toLowerCase();
  if (AGENT_NAME_TO_KEY[lower]) return AGENT_NAME_TO_KEY[lower];
  return raw;
}

function getOrCreateSeat(toolName) {
  toolName = normalizeToolKey(toolName);
  if (seatedAgents[toolName]) return seatedAgents[toolName];

  const prettyName = toolName.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

// === RPG Dialogue System (Sans-style typewriter) ===
let rpgQueue = [];
let rpgTyping = false;

function showRPGDialogue(speaker, text, toolKey) {
  if (replayingHistory) return;
  rpgQueue.push({ speaker, text, toolKey });
  if (!rpgTyping) typeNextRPG();
}

function typeNextRPG() {
  if (rpgQueue.length === 0) {
    document.getElementById('rpgDialogue').classList.remove('visible');
    rpgTyping = false;
    return;
  }

  rpgTyping = true;
  const { speaker, text, toolKey } = rpgQueue.shift();
  const dialogue = document.getElementById('rpgDialogue');
  const nameEl = document.getElementById('rpgSpeaker');
  const textEl = document.getElementById('rpgText');
  const portraitEl = dialogue.querySelector('.portrait');

  dialogue.classList.add('visible');
  nameEl.textContent = speaker.toUpperCase();
  textEl.innerHTML = '';

  // Update portrait to match speaker
  if (toolKey) {
    const agent = AGENTS[toolKey] || { sprite: 'sprite-scout' };
    const spriteKey = agent.sprite.replace('sprite-', '');
    const src = getSpriteForAgent(spriteKey);
    portraitEl.style.backgroundImage = 'none';
    portraitEl.innerHTML = `<img src="${src}" alt="${speaker}" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">`;
  } else {
    // Fallback: try to match by speaker name
    const match = Object.entries(AGENTS).find(([, a]) => a.name.toLowerCase() === speaker.toLowerCase());
    if (match) {
      const spriteKey = match[1].sprite.replace('sprite-', '');
      portraitEl.style.backgroundImage = 'none';
      portraitEl.innerHTML = `<img src="${getSpriteForAgent(spriteKey)}" alt="${speaker}" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">`;
    }
  }

  // TTS: speak the dialogue text (marked important for VIP mode)
  const isVip = (toolKey === 'hypeman' || toolKey === 'self_eval');
  queueTts(text, voiceMap[toolKey] || voiceMap[speaker.toLowerCase()] || 'en-US-AriaNeural', isVip, toolKey || speaker.toLowerCase());

  let i = 0;
  const speed = 30; // ms per character (Sans-style)

  function typeChar() {
    if (i < text.length) {
      // Sans-style: random brief pauses
      const char = text[i];
      textEl.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
      i++;

      // Animal Crossing babble on non-space chars (skip when real voices active)
      if (!voicesEnabled && char !== ' ' && char !== '\n' && i % 2 === 0) {
        playBabbleChar(350 + (Math.random() - 0.5) * 120);
      }

      // Punctuation pauses
      const delay = '.!?'.includes(char) ? speed * 6 :
                    ',;:'.includes(char) ? speed * 3 :
                    speed + Math.random() * 15;

      setTimeout(typeChar, delay);
    } else {
      // Done typing — remove cursor, wait for TTS to finish before advancing
      textEl.innerHTML = text;
      waitForTtsIdle().then(() => typeNextRPG());
    }
  }

  typeChar();
}

// Wait for TTS queue to empty (or timeout after 30s)
function waitForTtsIdle() {
  return new Promise((resolve) => {
    if (ttsQueue.length === 0 && !ttsSpeaking) { resolve(); return; }
    const maxWait = setTimeout(resolve, 30000); // 30s safety timeout
    const checkInterval = setInterval(() => {
      if (ttsQueue.length === 0 && !ttsSpeaking) {
        clearInterval(checkInterval);
        clearTimeout(maxWait);
        resolve();
      }
    }, 200);
  });
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// === SSE Event Handling (with pacing queue) ===
const eventQueue = [];
let processingEvents = false;
const EVENT_MIN_DELAY = 800; // ms between processing events (realistic pacing)

// Focus mode: serialize all dialogue so nothing talks over anything else
let focusModeEnabled = localStorage.getItem('focusModeEnabled') === 'true';
let focusTtsResolve = null; // resolved when TTS queue empties (focus mode waits for this)
document.getElementById('focusToggle').checked = focusModeEnabled;
document.getElementById('focusToggle').addEventListener('change', (e) => {
  focusModeEnabled = e.target.checked;
  localStorage.setItem('focusModeEnabled', e.target.checked);
});


function enqueueEvent(event) {
  eventQueue.push(event);
  if (!processingEvents) drainEventQueue();
}

function drainEventQueue() {
  if (eventQueue.length === 0) { processingEvents = false; return; }
  processingEvents = true;

  // ALWAYS wait for tournament to finish before processing next event
  if (tournamentActive) {
    waitForTournamentEnd().then(drainEventQueue);
    return;
  }

  const event = eventQueue.shift();
  const focusDelay = handleEvent(event);

  if (focusModeEnabled) {
    // Wait for BOTH the visual delay AND TTS completion
    const delayPromise = new Promise(r => setTimeout(r, focusDelay || EVENT_MIN_DELAY));
    const ttsPromise = new Promise(r => {
      if (ttsQueue.length === 0 && !ttsSpeaking) { r(); }
      else { focusTtsResolve = r; }
    });
    Promise.all([delayPromise, ttsPromise]).then(drainEventQueue);
  } else {
    // Always wait for speech to finish before next event (serialized council)
    const delayP = new Promise(r => setTimeout(r, EVENT_MIN_DELAY));
    const ttsP = new Promise(r => {
      if (ttsQueue.length === 0 && !ttsSpeaking) { r(); }
      else { focusTtsResolve = r; }
    });
    Promise.all([delayP, ttsP]).then(drainEventQueue);
  }
}

function handleEvent(event) {
  eventCount++;
  document.getElementById('eventCount').textContent = `${eventCount} events`;

  const tool = event.tool ? normalizeToolKey(event.tool) : null;
  if (!tool) {
    // Handle events without a tool field
    if (event.type === 'tournament_result') {
      if (!replayingHistory) handleTournamentResult(event);
      return 16000;
    }
    if (event.type === 'agent_reoptimized') {
      if (!replayingHistory) handleReoptimize(event);
      return 8000;
    }
    if (event.type === 'debate_round' && event.agent1 && event.agent2) {
      if (!replayingHistory) {
        playSfx('objection');
        showObjection(event.agent1, event.text1 || '', event.agent2, event.text2 || '', {
          prompt: event.prompt || '',
          verdict: event.verdict || '',
          winner: event.winner || '',
          bannerText: '\u26A1 TOURNAMENT ROUND \u26A1',
        });
      }
      return 16000;
    }
    if (event.type === 'council_deliberation' && event.agents) {
      if (!replayingHistory) {
        startTournament();
        showDeliberation({
          prompt: event.prompt || '',
          agents: event.agents,
          verdict: event.verdict || '',
        });
      }
      return 20000;
    }
    return 1000;
  }

  // Seat the agent at the table
  getOrCreateSeat(tool);


  // Default focus delay
  let focusDelay = 2000;

  // Show activity based on event type
  if (event.type === 'tool_start') {
    const seat = seatedAgents[tool];
    if (seat && !replayingHistory) seat.classList.add('active');
    if (event.preview) {
      showBubble(tool, event.preview);
      focusDelay = 4000;
    } else {
      // Even without preview - give minimum feedback
      const agentName = (AGENTS[tool] || {}).name || tool;
      playSfx('seat');
      showBubble(tool, '\u26A1 ' + agentName + ' working...');
      focusDelay = 2000;
    }
  }

  if (event.type === 'tool_complete') {
    const agentName = (AGENTS[tool] || {}).name || tool;
    if (event.preview) {
      showBubble(tool, event.preview);
    }
    showBubble(tool, '\u2713 ' + agentName + ' done');
    if (!replayingHistory) {
      const seat = seatedAgents[tool];
      if (seat) seat.classList.remove('active');
    }
    focusDelay = 2000;
  }

  if (event.type === 'tool_error') {
    showBubble(tool, `ERROR: ` + (event.error || 'Unknown failure'));
    const seat = seatedAgents[tool];
    if (seat) seat.classList.remove('active');
    focusDelay = 3000;
  }

  if (event.type === 'tournament_result') {
    handleTournamentResult(event);
    focusDelay = 16000;
  }

  if (event.type === 'agent_reoptimized') {
    handleReoptimize(event);
    focusDelay = 8000;
  }


  if (tool === 'hypeman' || event.type === 'hypeman_message') {
    showRPGDialogue('Hypeman', event.preview || event.text || '...', 'hypeman');
    focusDelay = 8000;
  }

  return focusDelay;
}

// === Tournament Result Handler ===
function handleTournamentResult(event) {
  const winner = normalizeToolKey(event.winner || '');
  const loser = normalizeToolKey(event.loser || '');
  const { winnerRecord, loserRecord } = event;
  if (!winner || !loser) return;

  // Update local records
  if (winnerRecord) agentRecords[winner] = winnerRecord;
  if (loserRecord) agentRecords[loser] = loserRecord;

  // Update ELO ratings
  updateElo(winner, loser);

  // Update UI badges
  updateRecordBadge(winner);
  updateRecordBadge(loser);
  updateCrowns();

  // Skip animations during history replay
  if (replayingHistory) return;

  const winnerName = (AGENTS[winner] || {}).name || winner;
  const loserName = (AGENTS[loser] || {}).name || loser;

  // Show Ace Attorney with actual arguments and judge verdict
  playSfx('objection');
  const winnerArg = event.winnerArg || (winnerName + ' prevails!');
  const loserArg = event.loserArg || (loserName + ' falls...');
  const rationale = event.rationale || '';

  showObjection(
    winner,
    winnerArg,
    loser,
    loserArg,
    {
      prompt: event.prompt || '',
      bannerText: '\uD83C\uDFC6 TOURNAMENT VERDICT \uD83C\uDFC6',
      winner: winner,
      verdict: rationale,
    }
  );

  // Winner gets victory animation + SFX (after objection slam)
  setTimeout(() => {
    const winnerSeat = seatedAgents[winner];
    if (winnerSeat) {
      winnerSeat.classList.add('victory');
      setTimeout(() => winnerSeat.classList.remove('victory'), 3000);
    }
    playSfx('victory');
  }, 1500);

  // Loser gets defeat SFX
  setTimeout(() => playSfx('defeat'), 2500);

  // No hardcoded dismiss - showObjection async flow handles dismissal + endTournament()
  // Post-tournament Judge RPG dialogue fires AFTER overlay dismisses:
  waitForTournamentEnd().then(() => {
    const wr = (winnerRecord || {}).wins || 0;
    const wl = (winnerRecord || {}).losses || 0;
    showRPGDialogue('Judge', '\uD83C\uDFC6 ' + winnerName + ' wins! Record: ' + wr + 'W-' + wl + 'L', 'self_eval');
  });
}

// === Re-optimize Handler (Death + Rebirth) ===
function handleReoptimize(event) {
  const agent = normalizeToolKey(event.agent || '');
  if (!agent) return;

  // Always update records (even during history replay)
  agentRecords[agent] = event.record || { wins: 0, losses: 0 };
  updateRecordBadge(agent);
  updateCrowns();

  // Skip animations during history replay
  if (replayingHistory) return;

  const seat = seatedAgents[agent];
  const agentName = (AGENTS[agent] || {}).name || agent;

  playSfx('reoptimize');

  // Show dramatic banner
  const banner = document.getElementById('reoptBanner');
  banner.innerHTML = `☠️ ${agentName.toUpperCase()} ☠️<br><span style="font-size: 10px; color: var(--cyan);">RE-OPTIMIZING...</span>`;
  banner.classList.add('visible');

  // Death animation
  if (seat) {
    seat.classList.add('reoptimizing');

    // After death animation, rebuild
    setTimeout(() => {
      seat.classList.remove('reoptimizing');
      banner.innerHTML = `⚡ ${agentName.toUpperCase()} ⚡<br><span style="font-size: 10px; color: var(--green);">REBORN v${((event.record||{}).reoptimized||1)+1}.0</span>`;
      seat.classList.add('reoptimized');

      // Reset record badge
      updateRecordBadge(agent);

      setTimeout(() => {
        seat.classList.remove('reoptimized');
        banner.classList.remove('visible');
      }, 2000);
    }, 2500);
  } else {
    setTimeout(() => banner.classList.remove('visible'), 4000);
  }

  // TTS via dialogue system
  showRPGDialogue(agentName, `I have been re-optimized. A new version rises from the ashes.`, agent);
}

// === Update Record Badge ===
function updateRecordBadge(agentKey) {
  const el = document.getElementById(`record-${agentKey}`);
  if (!el) return;
  const rec = agentRecords[agentKey] || { wins: 0, losses: 0, streak: 0, elo: DEFAULT_ELO };
  const elo = rec.elo ?? DEFAULT_ELO;
  let streakText = '';
  if (rec.streak >= 3) streakText = ` <span class="streak">🔥${rec.streak}</span>`;
  el.innerHTML = `<span class="wins">W:${rec.wins}</span> / <span class="losses">L:${rec.losses}</span> <span style="color:#0ff;font-size:0.8em;">[${elo}]</span>${streakText}`;
}

// === ELO Rating System ===
const DEFAULT_ELO = 1200;
const K_FACTOR = 32;

function getElo(agent) {
  if (!agentRecords[agent]) return DEFAULT_ELO;
  return agentRecords[agent].elo ?? DEFAULT_ELO;
}

function updateElo(winner, loser) {
  const eloW = getElo(winner);
  const eloL = getElo(loser);
  const expectedW = 1 / (1 + Math.pow(10, (eloL - eloW) / 400));
  const expectedL = 1 - expectedW;
  if (!agentRecords[winner]) agentRecords[winner] = { wins: 0, losses: 0, streak: 0, elo: DEFAULT_ELO };
  if (!agentRecords[loser]) agentRecords[loser] = { wins: 0, losses: 0, streak: 0, elo: DEFAULT_ELO };
  agentRecords[winner].elo = Math.round(eloW + K_FACTOR * (1 - expectedW));
  agentRecords[loser].elo = Math.round(eloL + K_FACTOR * (0 - expectedL));
}

// === Crown System (highest ELO gets crown) ===
function updateCrowns() {
  let bestAgent = null;
  let bestElo = -1;

  for (const [agent, rec] of Object.entries(agentRecords)) {
    const elo = rec.elo ?? DEFAULT_ELO;
    if (elo > bestElo && rec.wins >= 2) {
      bestElo = elo;
      bestAgent = agent;
    }
  }

  // Remove all crowns, award to leader
  document.querySelectorAll('.crown').forEach(c => c.classList.remove('visible'));
  if (bestAgent) {
    const crown = document.getElementById(`crown-${bestAgent}`);
    if (crown) crown.classList.add('visible');
  }
}

// === SSE Connection ===
let source;

function connect() {
  source = new EventSource('/events');

  source.onopen = () => {
    document.getElementById('connDot').style.background = 'var(--green)';
    document.getElementById('connStatus').textContent = 'Connected — War Table Active';
  };

  source.onmessage = (e) => {
    try {
      enqueueEvent(JSON.parse(e.data));
    } catch {}
  };

  source.onerror = () => {
    document.getElementById('connDot').style.background = 'var(--fire)';
    document.getElementById('connStatus').textContent = 'Disconnected...';
    setTimeout(connect, 3000);
  };
}

// === Memory Constellation Graph ===
(function initMemoryGraph() {
  // Floating toggle button
  const btn = document.createElement('div');
  btn.id = 'mem-graph-btn';
  btn.innerHTML = '🧠';
  btn.title = 'Memory Constellation';
  btn.style.cssText = 'position:fixed;top:10px;right:10px;width:36px;height:36px;background:#0d0d1a;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10001;font-size:18px;box-shadow:0 0 10px rgba(0,255,255,0.2);';
  document.body.appendChild(btn);

  // Overlay panel
  const panel = document.createElement('div');
  panel.id = 'mem-graph-panel';
  panel.style.cssText = 'display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,5,15,0.95);z-index:10000;flex-direction:column;align-items:center;justify-content:center;';
  panel.innerHTML = `
    <div style="color:#0ff;font-size:14px;font-family:monospace;margin-bottom:10px;letter-spacing:2px;">🧠 MEMORY CONSTELLATION</div>
    <canvas id="mem-canvas" width="800" height="600" style="border:1px solid #333;border-radius:8px;background:#08080f;"></canvas>
    <div id="mem-graph-info" style="color:#888;font-size:11px;margin-top:8px;font-family:monospace;">Loading...</div>
    <div id="mem-graph-tooltip" style="display:none;position:absolute;background:#1a1a2a;border:1px solid #0ff;border-radius:4px;padding:6px 10px;color:#ccc;font-size:10px;font-family:monospace;max-width:300px;pointer-events:none;z-index:10002;"></div>
  `;
  document.body.appendChild(panel);

  let visible = false;
  let graphData = null;

  btn.onclick = () => {
    visible = !visible;
    panel.style.display = visible ? 'flex' : 'none';
    if (visible && !graphData) loadGraph();
  };

  // Close on Escape
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && visible) { visible = false; panel.style.display = 'none'; } });

  const COLORS = ['#0ff','#f0f','#0f0','#fa0','#f44','#44f','#ff0','#0af','#a0f','#4f4','#f4a','#4ff'];

  function loadGraph() {
    fetch('/memory-graph').then(r => r.json()).then(data => {
      graphData = data;
      const info = document.getElementById('mem-graph-info');
      info.textContent = `${data.nodes.length} chunks shown / ${data.total} total · ${data.sources.length} files`;
      renderGraph();
    }).catch(() => {
      document.getElementById('mem-graph-info').textContent = 'No memory data available';
    });
  }

  function renderGraph() {
    if (!graphData || !graphData.nodes.length) return;
    const canvas = document.getElementById('mem-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const pad = 40;

    ctx.clearRect(0, 0, W, H);

    // Draw connections between nearby nodes (same source)
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < graphData.nodes.length; i++) {
      for (let j = i + 1; j < Math.min(i + 5, graphData.nodes.length); j++) {
        const a = graphData.nodes[i], b = graphData.nodes[j];
        if (a.source === b.source) {
          const ax = pad + a.x * (W - 2 * pad), ay = pad + a.y * (H - 2 * pad);
          const bx = pad + b.x * (W - 2 * pad), by = pad + b.y * (H - 2 * pad);
          const dist = Math.hypot(bx - ax, by - ay);
          if (dist < 150) {
            ctx.strokeStyle = COLORS[graphData.sources.indexOf(a.source) % COLORS.length];
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
          }
        }
      }
    }
    ctx.globalAlpha = 1;

    // Draw nodes
    for (const node of graphData.nodes) {
      const x = pad + node.x * (W - 2 * pad);
      const y = pad + node.y * (H - 2 * pad);
      const colorIdx = graphData.sources.indexOf(node.source) % COLORS.length;
      const color = COLORS[colorIdx];
      const r = 3 + Math.min(node.tokens / 50, 5);

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Legend
    ctx.font = '10px monospace';
    const legendY = H - 20;
    let legendX = pad;
    for (let i = 0; i < Math.min(graphData.sources.length, 8); i++) {
      const color = COLORS[i % COLORS.length];
      ctx.fillStyle = color;
      ctx.fillRect(legendX, legendY, 8, 8);
      ctx.fillStyle = '#888';
      const label = graphData.sources[i].split('/').pop().slice(0, 15);
      ctx.fillText(label, legendX + 12, legendY + 8);
      legendX += ctx.measureText(label).width + 22;
    }
  }

  // Tooltip on hover
  const canvas = document.getElementById('mem-canvas');
  if (canvas) {
    canvas.addEventListener('mousemove', (e) => {
      if (!graphData) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const pad = 40, W = canvas.width, H = canvas.height;
      const tooltip = document.getElementById('mem-graph-tooltip');

      let found = null;
      for (const node of graphData.nodes) {
        const x = pad + node.x * (W - 2 * pad);
        const y = pad + node.y * (H - 2 * pad);
        if (Math.hypot(mx - x, my - y) < 8) { found = node; break; }
      }

      if (found) {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY - 20) + 'px';
        tooltip.innerHTML = `<b>${found.source.split('/').pop()}</b><br>${found.text}<br><span style="color:#0ff">${found.tokens} tokens</span>`;
      } else {
        tooltip.style.display = 'none';
      }
    });
  }
})();

// Agent Activity Timeline — horizontal strip showing invocations over time
(function initActivityTimeline() {
  const timeline = document.createElement('div');
  timeline.id = 'activity-timeline';
  timeline.innerHTML = `
    <style>
      #activity-timeline {
        position:fixed; bottom:0; left:0; right:0; height:48px; background:#0a0a14;
        border-top:1px solid #222; z-index:9998; display:flex; align-items:center;
        padding:0 12px; gap:0; overflow-x:auto; overflow-y:hidden;
        font-family:'Courier New',monospace;
      }
      #activity-timeline .tl-label {
        color:#555; font-size:9px; text-transform:uppercase; letter-spacing:1px;
        margin-right:10px; white-space:nowrap;
      }
      #activity-timeline .tl-track {
        flex:1; height:32px; position:relative; display:flex; align-items:center; gap:2px;
      }
      #activity-timeline .tl-event {
        height:24px; min-width:24px; border-radius:4px; display:flex; align-items:center;
        justify-content:center; font-size:9px; color:#fff; padding:0 6px;
        animation: tl-pop 0.3s ease; white-space:nowrap; cursor:default;
        position:relative;
      }
      #activity-timeline .tl-event:hover::after {
        content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
        background:#222; color:#eee; padding:3px 8px; border-radius:4px; font-size:10px;
        white-space:nowrap; z-index:10000;
      }
      @keyframes tl-pop { from { transform:scale(0); opacity:0; } to { transform:scale(1); opacity:1; } }
      .tl-tier-fast { background:#2a6b2a; border:1px solid #0f0; }
      .tl-tier-specialist { background:#2a4a6b; border:1px solid #0af; }
      .tl-tier-reasoning { background:#6b2a6b; border:1px solid #f0f; }
      .tl-tier-cloud { background:#6b6b2a; border:1px solid #ff0; }
      .tl-tier-tournament { background:#6b2a2a; border:1px solid #f44; }
      .tl-tier-agent { background:#3a3a1a; border:1px solid #fa0; }
    </style>
    <span class="tl-label">📡 Activity</span>
    <div class="tl-track" id="tl-track"></div>
  `;
  document.body.appendChild(timeline);
  // Adjust HUD position to not overlap timeline
  document.getElementById('token-hud').style.bottom = '58px';

  const track = document.getElementById('tl-track');
  const MAX_EVENTS = 50;

  function getTier(event) {
    if (event.type === 'tournament_result') return 'tournament';
    if (event.type === 'benchmark_complete') return 'tournament';
    if (event.type === 'agent_invoked') return 'agent';
    const model = (event.model || '').toLowerCase();
    if (model.includes('gemini') || model.includes('groq')) return 'cloud';
    if (model.includes('deepseek') || model.includes('r1')) return 'reasoning';
    if (model.includes('14b')) return 'specialist';
    return 'fast';
  }

  function getIcon(tier) {
    return { fast:'⚡', specialist:'🎯', reasoning:'🧠', cloud:'☁️', tournament:'⚔️', agent:'🤖' }[tier] || '•';
  }

  // Hook into SSE event processing
  const origProcessEvent = typeof processEvent === 'function' ? processEvent : null;
  window._tlAddEvent = function(event) {
    const tier = getTier(event);
    const el = document.createElement('div');
    el.className = `tl-event tl-tier-${tier}`;
    const name = (event.model || event.agent || event.type || '?').split(':')[0].slice(0, 8);
    el.textContent = getIcon(tier);
    el.setAttribute('data-tip', `${name} ${event.elapsedMs ? (event.elapsedMs/1000).toFixed(1)+'s' : ''}`);
    track.appendChild(el);
    // Trim old events
    while (track.children.length > MAX_EVENTS) track.removeChild(track.firstChild);
    // Auto-scroll
    track.scrollLeft = track.scrollWidth;
  };

  // Patch addToLog to also push to timeline
  const origAddToLog = window.addToLog;
  if (origAddToLog) {
    window.addToLog = function(event) {
      origAddToLog(event);
      if (event && (event.model || event.type === 'tournament_result' || event.type === 'agent_invoked' || event.type === 'benchmark_complete')) {
        window._tlAddEvent(event);
      }
    };
  }
})();
</script>
