<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Council — Command Center</title>
<style>
:root {
  --bg: #0a0a12;
  --surface: #12121f;
  --surface2: #1a1a2e;
  --border: #2a2a4a;
  --text: #e0e0f0;
  --dim: #8888aa;
  --accent: #00f0ff;
  --fire: #ff4444;
  --gold: #ffd700;
  --green: #00ff88;
  --purple: #a855f7;
  --red: #ff3366;
  --blue: #3388ff;
  --font: 'Courier New', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* === Header === */
.header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.header h1 {
  font-size: 14px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
}
.header .nav-links {
  display: flex; gap: 12px; margin-left: auto;
}
.header .nav-links a {
  color: var(--dim);
  text-decoration: none;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  transition: all 0.2s;
}
.header .nav-links a:hover { color: var(--accent); border-color: var(--accent); }

/* === Main Layout === */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* === Chat Panel (left) === */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 300px;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.msg.user {
  align-self: flex-end;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.msg.assistant {
  align-self: flex-start;
  background: linear-gradient(135deg, #0d1a2a 0%, #0a1520 100%);
  border: 1px solid #1a3050;
}
.msg.assistant .meta {
  display: flex; gap: 8px; margin-top: 8px; font-size: 10px; color: var(--dim); flex-wrap: wrap;
}
.msg.assistant .meta .model { color: var(--accent); }
.msg.assistant .meta .tool { color: var(--purple); }
.msg.assistant .meta .reason { color: var(--gold); font-style: italic; }
.msg.system {
  align-self: center;
  background: transparent;
  color: var(--dim);
  font-size: 11px;
  border: 1px dashed var(--border);
  padding: 8px 16px;
}

.streaming::after { content: '▌'; animation: blink 0.7s infinite; color: var(--accent); }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

/* === Input Area === */
.input-area {
  padding: 16px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.input-row {
  display: flex; gap: 8px; align-items: flex-end;
}
.input-row textarea {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 10px 14px;
  border-radius: 6px;
  resize: none;
  min-height: 44px;
  max-height: 200px;
  outline: none;
}
.input-row textarea:focus { border-color: var(--accent); }
.input-row button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 10px 20px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  text-transform: uppercase;
}
.input-row button:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }
.controls {
  display: flex; gap: 12px; margin-top: 10px; align-items: center; flex-wrap: wrap;
}
.controls select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  padding: 5px 10px; font-family: var(--font); font-size: 11px; border-radius: 4px;
}
.controls label { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 4px; cursor: pointer; }
.controls input[type="checkbox"] { accent-color: var(--accent); }
.status-indicator { margin-left: auto; font-size: 10px; }
.status-indicator.connected { color: var(--green); }
.status-indicator.error { color: var(--fire); }

/* === Resize Divider === */
.resize-divider {
  width: 6px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
}
.resize-divider:hover, .resize-divider.dragging { background: var(--accent); }

/* === Dialogue Theatre (right) === */
.theatre-panel {
  width: 420px;
  min-width: 280px;
  max-width: 700px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.theatre-header {
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.theatre-header h2 { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.panel-tabs { display: flex; gap: 6px; margin-left: auto; }
.panel-tabs button {
  background: var(--bg); border: 1px solid var(--border); color: var(--dim);
  font-family: var(--font); font-size: 11px; padding: 5px 12px; border-radius: 4px; cursor: pointer;
}
.panel-tabs button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.panel-tabs button:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* Dialogue frames — Judge verdict style (Ace Attorney) */
.dialogue-view {
  flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  background: radial-gradient(ellipse at center bottom, #1a0520 0%, var(--bg) 70%);
}
.dialogue-frame {
  display: flex; gap: 14px; padding: 14px 16px; border-radius: 4px;
  border: 2px solid var(--border); background: rgba(5,5,15,0.9);
  animation: slideIn 0.3s ease;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
}
@keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.dialogue-frame.frame-fast { border-color: var(--green); box-shadow: 0 0 15px rgba(0,255,136,0.15), inset 0 1px 0 rgba(0,255,136,0.05); }
.dialogue-frame.frame-specialist { border-color: var(--blue); box-shadow: 0 0 15px rgba(51,136,255,0.15), inset 0 1px 0 rgba(51,136,255,0.05); }
.dialogue-frame.frame-reasoning { border-color: var(--purple); box-shadow: 0 0 15px rgba(168,85,247,0.15), inset 0 1px 0 rgba(168,85,247,0.05); }
.dialogue-frame.frame-judge { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.2), inset 0 1px 0 rgba(255,215,0,0.05); }
.dialogue-frame.frame-hypeman { border-color: var(--fire); box-shadow: 0 0 15px rgba(255,68,68,0.15), inset 0 1px 0 rgba(255,68,68,0.05); }
.dialogue-frame.frame-red { border-color: var(--red); background: linear-gradient(135deg, #1a0808 0%, rgba(5,5,15,0.9) 100%); box-shadow: 0 0 20px rgba(255,51,102,0.2); }
.dialogue-frame.frame-blue { border-color: var(--blue); background: linear-gradient(135deg, #08081a 0%, rgba(5,5,15,0.9) 100%); box-shadow: 0 0 20px rgba(51,136,255,0.2); }

.dialogue-portrait {
  width: 64px; height: 64px; border-radius: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface2); border: 2px solid var(--border);
  overflow: hidden; image-rendering: pixelated;
}
.dialogue-portrait img {
  width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
}
.frame-fast .dialogue-portrait { border-color: var(--green); background: linear-gradient(180deg, #0a2a1a 0%, var(--surface2) 100%); }
.frame-specialist .dialogue-portrait { border-color: var(--blue); background: linear-gradient(180deg, #0a1a2a 0%, var(--surface2) 100%); }
.frame-reasoning .dialogue-portrait { border-color: var(--purple); background: linear-gradient(180deg, #1a0a2a 0%, var(--surface2) 100%); }
.frame-judge .dialogue-portrait { border-color: var(--gold); background: linear-gradient(180deg, #2a2a0a 0%, var(--surface2) 100%); }
.frame-hypeman .dialogue-portrait { border-color: var(--fire); background: linear-gradient(180deg, #2a0a0a 0%, var(--surface2) 100%); }
.frame-red .dialogue-portrait { border-color: var(--red); }
.frame-blue .dialogue-portrait { border-color: var(--blue); }

.dialogue-content { flex: 1; min-width: 0; }
.dialogue-name { font-size: 12px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 2px; }
.frame-fast .dialogue-name { color: var(--green); text-shadow: 0 0 8px rgba(0,255,136,0.3); }
.frame-specialist .dialogue-name { color: var(--blue); text-shadow: 0 0 8px rgba(51,136,255,0.3); }
.frame-reasoning .dialogue-name { color: var(--purple); text-shadow: 0 0 8px rgba(168,85,247,0.3); }
.frame-judge .dialogue-name { color: var(--gold); text-shadow: 0 0 8px rgba(255,215,0,0.3); }
.frame-hypeman .dialogue-name { color: var(--fire); text-shadow: 0 0 8px rgba(255,68,68,0.3); }
.frame-red .dialogue-name { color: var(--red); text-shadow: 0 0 8px rgba(255,51,102,0.3); }
.frame-blue .dialogue-name { color: var(--blue); text-shadow: 0 0 8px rgba(51,136,255,0.3); }

.dialogue-text { font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; color: var(--text); }
.dialogue-meta { margin-top: 8px; font-size: 10px; color: var(--dim); opacity: 0.7; }

/* Tournament duel header */
.duel-header {
  text-align: center; padding: 12px 16px; font-size: 14px; color: var(--gold);
  text-transform: uppercase; letter-spacing: 3px; font-weight: bold;
  border: 2px solid var(--gold); border-radius: 4px;
  background: linear-gradient(135deg, #1a1500 0%, rgba(5,5,15,0.9) 100%);
  box-shadow: 0 0 20px rgba(255,215,0,0.15);
  text-shadow: 0 0 10px rgba(255,215,0,0.4);
}

/* Events log */
.events-view {
  flex: 1; overflow-y: auto; padding: 12px; display: none; flex-direction: column; gap: 6px;
}
.events-view.active { display: flex; }
.ev-item { padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; }
.ev-item .ev-tool { color: var(--purple); }
.ev-item .ev-model { color: var(--accent); }
.ev-item .ev-text { color: var(--dim); font-size: 10px; margin-top: 2px; }

/* Stats */
.theatre-stats {
  padding: 8px 16px; border-top: 1px solid var(--border);
  font-size: 10px; color: var(--dim); display: flex; gap: 16px;
}
.theatre-stats .stat-val { color: var(--green); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 768px) { .theatre-panel, .resize-divider { display: none; } }
</style>
</head>
<body>

<div class="header">
  <h1>⚔️ Command Center</h1>
  <div class="nav-links">
    <a href="/war-table">War Table</a>
    <a href="/">Battle Log</a>
  </div>
</div>

<div class="main">
  <div class="chat-panel" id="chatPanel">
    <div class="chat-messages" id="chatMessages">
      <div class="msg system">
        War Council Command Center — Type a message. The council routes to the best model.<br>
        Toggle Tournament for multi-model debate. Agents appear in the Dialogue Theatre →
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="chatInput" placeholder="Ask the War Council..." rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">SEND</button>
      </div>
      <div class="controls">
        <select id="modeSelect">
          <option value="auto">⚡ Auto-Route</option>
          <option value="fast">🏃 Fast (7B)</option>
          <option value="specialist">🎯 Specialist (14B)</option>
          <option value="reasoning">🧠 Reasoning (14B)</option>
        </select>
        <label><input type="checkbox" id="tournamentToggle"> 🏟️ Tournament</label>
        <label><input type="checkbox" id="showReason" checked> 📋 Routing</label>
        <span class="status-indicator" id="statusIndicator">● Connecting...</span>
      </div>
    </div>
  </div>

  <div class="resize-divider" id="resizeDivider"></div>

  <div class="theatre-panel" id="theatrePanel">
    <div class="theatre-header">
      <h2>🎭 Dialogue Theatre</h2>
      <div class="panel-tabs">
        <button class="active" id="tabDialogue" onclick="switchTab('dialogue')">Dialogue</button>
        <button id="tabEvents" onclick="switchTab('events')">Events</button>
      </div>
    </div>
    <div class="dialogue-view" id="dialogueView"></div>
    <div class="events-view" id="eventsView"></div>
    <div class="theatre-stats">
      <span>Msgs: <span class="stat-val" id="statMessages">0</span></span>
      <span>Tokens: <span class="stat-val" id="statTokens">0</span></span>
      <span>Avg: <span class="stat-val" id="statAvgMs">-</span></span>
    </div>
  </div>
</div>

<script>
let messageCount = 0, totalTokens = 0, totalMs = 0, isStreaming = false;

const AGENT_CONFIG = {
  consult_fast: { name: 'Scout', sprite: 'scout', emoji: '🏃', frame: 'frame-fast' },
  consult_specialist: { name: 'Specialist', sprite: 'specialist', emoji: '⚔️', frame: 'frame-specialist' },
  consult_reasoning: { name: 'Sage', sprite: 'sage', emoji: '🧠', frame: 'frame-reasoning' },
  self_eval: { name: 'Judge', sprite: 'judge', emoji: '⚖️', frame: 'frame-judge' },
  hypeman: { name: 'Hypeman', sprite: 'hypeman', emoji: '🔥', frame: 'frame-hypeman' },
};

// Pixel art sprite data (inline SVGs)
const SPRITES = {
  scout: { grid: ['________________','___bbbb_________','__baaaab________','__baabab________','__baaaab________','___bbbb_________','____bb__________','__baaaab________','__baaaab________','___baab_________','___baab_________','___b__b_________','__bb__bb________','________________','________________','________________'], pal: {a:'#00ff88',b:'#004422'} },
  specialist: { grid: ['________________','___cccc_________','__cccccc________','__caacac________','__cccccc________','___cccc_________','____cc__________','__cccccc________','_ccccccc c______','__cccccc________','___cccc_________','___c__c_________','__cc__cc________','________________','________________','________________'], pal: {a:'#ffffff',c:'#3388ff'} },
  sage: { grid: ['___pppppp_______','__pppppppp______','__pa___ap_______','__pppppp________','___pppp_________','____pp__________','__pppppp________','__pppppp________','___pppp_________','___pppp_________','___p__p_________','__pp__pp________','________________','________________','________________','________________'], pal: {a:'#ffffff',p:'#a855f7'} },
  judge: { grid: ['__gggggggg______','__gggggggg______','__gaaggaag______','__gggggggg______','___gggggg_______','____gg__________','__gggggggg______','_gggggggggg_____','__gggggggg______','___ggggg________','___gg_gg________','__ggg_ggg_______','________________','________________','________________','________________'], pal: {a:'#ffffff',g:'#ffd700'} },
  hypeman: { grid: ['___dddd_________','___daad_________','___aaaa____d____','___abba____d____','__baaaab___d____','__bacaab__dd____','__baaaab________','__baaaab________','___babb_________','___ba_ab________','__bb___bb_______','__be___eb_______','________________','________________','________________','________________'], pal: {a:'#ff4444',b:'#440000',c:'#ffaa00',d:'#ff8800',e:'#880000'} },
};

function makeSpriteURI(name) {
  const s = SPRITES[name];
  if (!s) return '';
  let rects = '';
  for (let y = 0; y < 16; y++) {
    const row = s.grid[y];
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (ch !== '_' && s.pal[ch]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${s.pal[ch]}"/>`;
    }
  }
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">${rects}</svg>`);
}

// SSE
let evtSource;
function connectSSE() {
  evtSource = new EventSource('/events');
  evtSource.onopen = () => { document.getElementById('statusIndicator').textContent = '● Connected'; document.getElementById('statusIndicator').className = 'status-indicator connected'; };
  evtSource.onmessage = (e) => { try { addEventItem(JSON.parse(e.data)); } catch {} };
  evtSource.onerror = () => { document.getElementById('statusIndicator').textContent = '● Reconnecting...'; document.getElementById('statusIndicator').className = 'status-indicator error'; setTimeout(connectSSE, 3000); };
}
connectSSE();

// Chat
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message || isStreaming) return;
  input.value = ''; autoResize(input);
  addMessage('user', message);
  const mode = document.getElementById('modeSelect').value;
  if (document.getElementById('tournamentToggle').checked) { await sendTournament(message); }
  else { await sendChat(message, mode === 'auto' ? undefined : mode); }
}

async function sendChat(message, mode) {
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  const msgEl = addMessage('assistant', '');
  msgEl.classList.add('streaming');
  try {
    const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, mode }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', fullText = '', meta = {};
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.token) { fullText += data.token; msgEl.querySelector('.msg-text').textContent = fullText; scrollToBottom(); }
          if (data.done) meta = data;
          if (data.error) { fullText = '⚠️ ' + data.error; msgEl.querySelector('.msg-text').textContent = fullText; }
        } catch {}
      }
    }
    msgEl.classList.remove('streaming');
    if (meta.model) {
      const metaEl = document.createElement('div'); metaEl.className = 'meta';
      metaEl.innerHTML = `<span class="model">${meta.model}</span><span class="tool">${meta.tool||''}</span><span>${meta.elapsedMs?(meta.elapsedMs/1000).toFixed(1)+'s':''}</span><span>${meta.tokensOut?meta.tokensOut+' tok':''}</span>${document.getElementById('showReason').checked && meta.reason ? `<span class="reason">${meta.reason}</span>` : ''}`;
      msgEl.appendChild(metaEl);
      addDialogueFrame(meta.tool || 'consult_specialist', fullText, meta);
      messageCount++; totalTokens += meta.tokensOut || 0; totalMs += meta.elapsedMs || 0; updateStats();
    }
  } catch (e) { msgEl.classList.remove('streaming'); msgEl.querySelector('.msg-text').textContent = '⚠️ ' + e.message; }
  isStreaming = false; document.getElementById('sendBtn').disabled = false; document.getElementById('chatInput').focus();
}

async function sendTournament(message) {
  isStreaming = true; document.getElementById('sendBtn').disabled = true;
  addMessage('system', '🏟️ Tournament — All models respond.');
  const duelHeader = document.createElement('div'); duelHeader.className = 'duel-header'; duelHeader.textContent = '⚡ TOURNAMENT ROUND ⚡';
  document.getElementById('dialogueView').appendChild(duelHeader);

  const modes = [
    { mode: 'fast', frame: 'frame-red', label: 'CHALLENGER' },
    { mode: 'specialist', frame: 'frame-blue', label: 'DEFENDER' },
    { mode: 'reasoning', frame: 'frame-judge', label: 'ARBITER' },
  ];
  const responses = [];
  for (const { mode, frame, label } of modes) {
    const msgEl = addMessage('assistant', ''); msgEl.classList.add('streaming');
    try {
      const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, mode }) });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', fullText = '', meta = {};
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) { if (!line.startsWith('data: ')) continue; try { const d = JSON.parse(line.slice(6)); if (d.token) { fullText += d.token; msgEl.querySelector('.msg-text').textContent = fullText; scrollToBottom(); } if (d.done) meta = d; } catch {} }
      }
      msgEl.classList.remove('streaming');
      const metaEl = document.createElement('div'); metaEl.className = 'meta';
      metaEl.innerHTML = `<span class="model">${meta.model||mode}</span><span>${meta.elapsedMs?(meta.elapsedMs/1000).toFixed(1)+'s':''}</span><span>${meta.tokensOut||0} tok</span>`;
      msgEl.appendChild(metaEl);
      addDialogueFrame(meta.tool || `consult_${mode}`, fullText, meta, frame, label);
      responses.push({ model: meta.model, text: fullText });
    } catch (e) { msgEl.classList.remove('streaming'); msgEl.querySelector('.msg-text').textContent = '⚠️ ' + e.message; }
  }
  if (responses.length >= 2) {
    fetch('/emit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'debate_round', agent1: 'consult_specialist', agent2: 'consult_reasoning', text1: (responses[1]?.text||'').slice(0,300), text2: (responses[2]?.text||'').slice(0,300), prompt: message, verdict: 'Tournament complete.', winner: 'consult_reasoning' }) }).catch(()=>{});
  }
  messageCount++; updateStats();
  isStreaming = false; document.getElementById('sendBtn').disabled = false; document.getElementById('chatInput').focus();
}

// Dialogue Theatre
function addDialogueFrame(toolKey, text, meta, overrideFrame, overrideLabel) {
  const config = AGENT_CONFIG[toolKey] || { name: toolKey.replace(/_/g,' '), sprite: 'scout', emoji: '🤖', frame: 'frame-specialist' };
  const frame = overrideFrame || config.frame;
  const displayName = overrideLabel ? `${overrideLabel} — ${config.name}` : config.name;
  const spriteURI = makeSpriteURI(config.sprite);
  const portraitHtml = spriteURI
    ? `<img src="${spriteURI}" alt="${config.name}">`
    : config.emoji;
  const el = document.createElement('div'); el.className = `dialogue-frame ${frame}`;
  el.innerHTML = `
    <div class="dialogue-portrait">${portraitHtml}</div>
    <div class="dialogue-content">
      <div class="dialogue-name">${displayName}</div>
      <div class="dialogue-text"></div>
      <div class="dialogue-meta">${meta.model||''} · ${meta.elapsedMs?(meta.elapsedMs/1000).toFixed(1)+'s':''} · ${meta.tokensOut||0} tok</div>
    </div>`;
  // Typewriter effect
  const textEl = el.querySelector('.dialogue-text');
  const truncated = text.length > 500 ? text.slice(0,497)+'...' : text;
  const escaped = escapeHtml(truncated);
  let i = 0;
  function typeChar() {
    if (i < escaped.length) {
      textEl.textContent += truncated[i];
      i++;
      setTimeout(typeChar, 12);
    }
  }
  typeChar();
  const container = document.getElementById('dialogueView');
  container.appendChild(el); container.scrollTop = container.scrollHeight;
}

// Helpers
function addMessage(role, text) {
  const el = document.createElement('div'); el.className = `msg ${role}`;
  if (role === 'assistant') el.innerHTML = `<span class="msg-text">${escapeHtml(text)}</span>`;
  else el.textContent = text;
  document.getElementById('chatMessages').appendChild(el); scrollToBottom(); return el;
}
function scrollToBottom() { const c = document.getElementById('chatMessages'); c.scrollTop = c.scrollHeight; }
function addEventItem(event) {
  const c = document.getElementById('eventsView');
  const el = document.createElement('div'); el.className = 'ev-item';
  el.innerHTML = `<span class="ev-tool">${event.tool||event.type||'?'}</span> <span class="ev-model">${event.model||''}</span>${event.text?`<div class="ev-text">${escapeHtml((event.text||'').slice(0,60))}</div>`:''}`;
  c.appendChild(el); while (c.children.length > 50) c.removeChild(c.firstChild); c.scrollTop = c.scrollHeight;
}
function updateStats() {
  document.getElementById('statMessages').textContent = messageCount;
  document.getElementById('statTokens').textContent = totalTokens;
  document.getElementById('statAvgMs').textContent = messageCount > 0 ? (totalMs/messageCount/1000).toFixed(1)+'s' : '-';
}
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Tab switch
function switchTab(tab) {
  const dv = document.getElementById('dialogueView'), ev = document.getElementById('eventsView');
  const td = document.getElementById('tabDialogue'), te = document.getElementById('tabEvents');
  if (tab === 'dialogue') { dv.style.display='flex'; ev.classList.remove('active'); td.classList.add('active'); te.classList.remove('active'); }
  else { dv.style.display='none'; ev.classList.add('active'); td.classList.remove('active'); te.classList.add('active'); }
}

// Resize divider
const divider = document.getElementById('resizeDivider');
const theatre = document.getElementById('theatrePanel');
let isDragging = false;
divider.addEventListener('mousedown', (e) => { isDragging = true; divider.classList.add('dragging'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; e.preventDefault(); });
document.addEventListener('mousemove', (e) => { if (!isDragging) return; const rect = document.querySelector('.main').getBoundingClientRect(); theatre.style.width = Math.max(280, Math.min(700, rect.right - e.clientX)) + 'px'; });
document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; divider.classList.remove('dragging'); document.body.style.cursor = ''; document.body.style.userSelect = ''; } });

// Textarea
const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
chatInput.addEventListener('input', () => autoResize(chatInput));
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; }
</script>
</body>
